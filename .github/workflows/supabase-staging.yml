name: Deploy Supabase migrations to staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    # On workflow_run, only proceed if CI succeeded.
    # workflow_dispatch bypasses this guard (useful for manual re-sync).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit whose CI succeeded to avoid a race where a
          # newer push lands before this job runs and gets deployed unvalidated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push --include-seed
