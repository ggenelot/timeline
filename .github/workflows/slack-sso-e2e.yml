name: Codex Slack SSO E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  slack-sso-e2e:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      CI: true
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      SLACK_OAUTH_REDIRECT_URI: ${{ secrets.SLACK_OAUTH_REDIRECT_URI }}
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
      SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEST_EMAIL: ${{ secrets.SLACK_TEST_EMAIL }}
      SLACK_TEST_PASSWORD: ${{ secrets.SLACK_TEST_PASSWORD }}
      SLACK_TEST_WORKSPACE_URL: ${{ secrets.SLACK_TEST_WORKSPACE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm exec playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Diagnose Slack OAuth
        run: npm run diagnose:slack-oauth

      - name: Slack SSO E2E
        run: npm run test:e2e:slack-sso
