name: Supabase Migration Timestamp Guard

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  check-duplicate-migration-timestamps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on duplicate migration timestamp prefixes
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sql_files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)

          if [ "${#sql_files[@]}" -eq 0 ]; then
            echo "No SQL migration files found in supabase/migrations."
            exit 0
          fi

          duplicates=$(printf '%s\n' "${sql_files[@]}" | cut -d'_' -f1 | sort | uniq -d)

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration timestamps detected:"
            while IFS= read -r timestamp; do
              [ -z "$timestamp" ] && continue
              echo "- $timestamp"
              printf '%s\n' "${sql_files[@]}" | awk -v ts="$timestamp" 'index($0, ts "_") == 1 {print "  • " $0}'
            done <<< "$duplicates"
            exit 1
          fi

          echo "No duplicate migration timestamp prefixes found."
