name: Codex Auto Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge') &&
      (
        startsWith(github.event.pull_request.user.login, 'codex') ||
        startsWith(github.event.pull_request.head.ref, 'codex/') ||
        contains(github.event.pull_request.title, '[codex]') ||
        startsWith(github.event.pull_request.head.ref, 'claude/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
