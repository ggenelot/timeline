name: Codex Auto Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enable-auto-merge:
    # claude/ PRs are opened under the human GitHub account (no dedicated bot
    # login), so branch prefix is the only reliable signal for them — this
    # isn't an oversight, codex's extra login/title checks exist because
    # codex can author PRs under different identities.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'staging' &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge') &&
      (
        startsWith(github.event.pull_request.user.login, 'codex') ||
        startsWith(github.event.pull_request.head.ref, 'codex/') ||
        contains(github.event.pull_request.title, '[codex]') ||
        startsWith(github.event.pull_request.head.ref, 'claude/')
      )
    runs-on: ubuntu-latest
    steps:
      # `gh pr merge --auto` only blocks on CI if the base branch has required
      # status checks configured. `staging` has no such ruleset, so we wait on
      # the checks ourselves before merging instead of relying on that config.
      #
      # `gh pr checks --watch` lists every check on the PR's head commit,
      # which includes this very job's own check run ("enable-auto-merge").
      # That check stays in_progress until this job finishes, so `--watch`
      # would wait on itself forever. Poll manually and ignore our own check.
      - name: Wait for checks, then merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          while true; do
            checks=$(gh pr checks "$PR_URL" --json name,bucket | jq '[.[] | select(.name != "enable-auto-merge")]')
            failed=$(echo "$checks" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')
            if [ "$failed" -gt 0 ]; then
              echo "$checks" | jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | .name'
              echo "A required check failed or was cancelled."
              exit 1
            fi
            pending=$(echo "$checks" | jq '[.[] | select(.bucket == "pending")] | length')
            if [ "$pending" -eq 0 ]; then
              break
            fi
            sleep 15
          done
          gh pr merge --squash "$PR_URL"
